<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Connect two words by filling the gaps. Each neighboring pair makes a familiar word or phrase. A new bridge every day." />
    <meta name="theme-color" content="#2f8fff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070d33" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Word Bridge · Daily word puzzle</title>
    <script>
      // Apply a saved light/dark choice before the first paint. React keeps it in sync afterwards.
      try {
        var theme = JSON.parse(localStorage.getItem('wordbridge.save') || '{}').theme
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Word Bridge needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
