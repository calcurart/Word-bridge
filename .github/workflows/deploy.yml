# Builds the site and publishes it to GitHub Pages on every push to main.
# Every night it also copies phrases accepted from player suggestions into src/data/community-links.ts,
# commits them if the tests and build pass, and republishes.
# One-time setup: repository Settings › Pages › Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 0 * * *' # 00:20 UTC, just after the daily puzzle changes
  workflow_dispatch:

permissions:
  contents: write # only used to commit synced community phrases
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync community phrases
        if: github.event_name != 'push'
        run: pnpm sync:community
      - run: pnpm test
      - run: pnpm build # typecheck + content validation + vite build
      - name: Commit synced phrases
        if: github.event_name != 'push'
        run: |
          git add src/data/community-links.ts
          if git diff --cached --quiet; then echo "No new community phrases."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add community phrases from verified suggestions"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
